spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/arena_db}
    username: ${DATABASE_USER:arena}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
server:
  port: ${PORT:8080}
logging:
  level:
    com.arenax: INFO
