global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend arena_api
    bind *:8081
    default_backend arena_nodes

backend arena_nodes
    balance roundrobin
    option httpchk GET /api/leagues?period=ALL_TIME
    http-check expect status 200
    server-template arena 10 backend:8080 check resolvers docker init-addr libc
