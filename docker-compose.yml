services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: arena_db
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena_db"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [arena]

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [arena]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/arena_db
      DATABASE_USER: arena
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
      ARENA_ADMIN_USERNAME: ${ARENA_ADMIN_USERNAME:?set ARENA_ADMIN_USERNAME in .env}
      ARENA_ADMIN_PASSWORD: ${ARENA_ADMIN_PASSWORD:?set ARENA_ADMIN_PASSWORD in .env}
      ALLOWED_ORIGIN_PATTERNS: ${ALLOWED_ORIGIN_PATTERNS:-http://localhost:3000}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8080
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 35s
    networks: [arena]

  api-gateway:
    image: haproxy:3.0-alpine
    volumes:
      - ./deploy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${API_HOST_PORT:-8081}:8081"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8081/api/leagues?period=ALL_TIME"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [arena]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8081/ws-arena}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      api-gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [arena]

volumes:
  postgres_data:

networks:
  arena:
    driver: bridge
